<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>RIMPA - বাংলা ভয়েস AI</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at center, #0d1629 0%, #050811 100%); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; text-align: center; padding: 15px; }
    .orb { width: 175px; height: 175px; border-radius: 50%; border: 3px solid #00f2fe; box-shadow: 0 0 35px rgba(0, 242, 254, 0.45); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; color: #00f2fe; letter-spacing: 3px; cursor: pointer; transition: 0.3s; user-select: none; }
    .orb.listening { border-color: #ff4b2b; color: #ff4b2b; box-shadow: 0 0 50px rgba(255, 75, 43, 0.8); transform: scale(1.07); }
    #status { margin-top: 26px; font-size: 15px; color: #94a3b8; max-width: 90%; }
    #userText { margin-top: 12px; font-size: 15px; color: #e2e8f0; }
    #replyText { margin-top: 16px; font-size: 17px; color: #38bdf8; max-width: 92%; line-height: 1.6; max-height: 32vh; overflow-y: auto; padding: 8px 12px; }
    #keyBox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 8, 17, 0.97); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
    input { padding: 13px; width: 90%; max-width: 340px; border-radius: 10px; border: 1.5px solid #00f2fe; background: #0f172a; color: #fff; margin-bottom: 14px; font-size: 14px; }
    .save-btn { padding: 12px 28px; border-radius: 10px; border: none; background: #00f2fe; color: #050811; font-weight: bold; font-size: 16px; cursor: pointer; }
    .reset-btn { position: fixed; bottom: 16px; right: 16px; background: rgba(15, 23, 42, 0.8); border: 1px solid #334155; color: #94a3b8; font-size: 12px; padding: 7px 12px; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="keyBox" style="display:none;">
    <h3 style="color:#00f2fe; margin-bottom:10px;">Google AI Studio API Key দিন</h3>
    <p style="color:#94a3b8; font-size:13px; margin-bottom:12px;">(AIzaSy... দিয়ে শুরু হওয়া Key পেস্ট করুন)</p>
    <input type="text" id="apiInput" placeholder="AIzaSy...">
    <button class="save-btn" onclick="saveKey()">Save করুন</button>
  </div>
  <div class="orb" id="orb" onclick="startListening()">RIMPA</div>
  <div id="status">কথা বলতে RIMPA-তে টাচ করুন</div>
  <div id="userText"></div>
  <div id="replyText"></div>
  <button class="reset-btn" onclick="resetKey()">API Key বদলান</button>

  <script>
    let API_KEY = (localStorage.getItem("rimpa_gemini_key") || "").trim();
    if (!API_KEY) document.getElementById("keyBox").style.display = "flex";

    function saveKey() {
      const val = document.getElementById("apiInput").value.trim();
      if (val) {
        localStorage.setItem("rimpa_gemini_key", val);
        API_KEY = val;
        document.getElementById("keyBox").style.display = "none";
        speak("নমস্কার শ্রীকান্ত, আমি রিম্পা। বলুন কীভাবে সাহায্য করতে পারি?");
      }
    }

    function resetKey() {
      localStorage.removeItem("rimpa_gemini_key");
      document.getElementById("apiInput").value = "";
      document.getElementById("keyBox").style.display = "flex";
    }

    function speak(text) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "bn-IN";
      utter.rate = 1.0;
      window.speechSynthesis.speak(utter);
    }

    function startListening() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        document.getElementById("status").innerText = "আপনার ব্রাউজার ভয়েস সাপোর্ট করছে না";
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = "bn-IN";
      recognition.interimResults = false;

      const orb = document.getElementById("orb");
      const status = document.getElementById("status");

      recognition.onstart = () => { orb.classList.add("listening"); status.innerText = "শুনছি... বাংলায় বলুন"; };
      recognition.onresult = async (event) => {
        const command = event.results[0][0].transcript;
        document.getElementById("userText").innerText = "আপনি: " + command;
        document.getElementById("replyText").innerText = "";
        status.innerText = "রিম্পা ভাবছে...";
        await processCommand(command);
      };
      recognition.onerror = () => { orb.classList.remove("listening"); status.innerText = "আবার টাচ করে বলুন"; };
      recognition.onend = () => { orb.classList.remove("listening"); };
      recognition.start();
    }

    async function fetchWithTimeout(url, options, timeout = 12000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);
      const response = await fetch(url, { ...options, signal: controller.signal });
      clearTimeout(id);
      return response;
    }

    async function processCommand(cmd) {
      if (cmd.includes("ইউটিউব") || cmd.toLowerCase().includes("youtube")) {
        speak("ইউটিউব খুলছি"); window.open("https://www.youtube.com", "_blank");
        document.getElementById("status").innerText = "কথা বলতে RIMPA-তে টাচ করুন"; return;
      }
      if (cmd.includes("হোয়াটসঅ্যাপ") || cmd.toLowerCase().includes("whatsapp")) {
        speak("হোয়াটসঅ্যাপ খুলছি"); window.open("https://wa.me/", "_blank");
        document.getElementById("status").innerText = "কথা বলতে RIMPA-তে টাচ করুন"; return;
      }

      try {
        // আপনার API Key দিয়ে সচল মডেলটি নিজে থেকেই খুঁজে নেবে
        const listRes = await fetchWithTimeout(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(API_KEY)}`, {}, 10000);
        const listData = await listRes.json();

        if (listData.error) {
          document.getElementById("status").innerText = "API Key সমস্যা: " + listData.error.message;
          return;
        }

        const validModels = (listData.models || [])
          .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent") && m.name.includes("flash"))
          .map(m => m.name);

        const targetModel = validModels[0] || "models/gemini-3.8-flash";

        const response = await fetchWithTimeout(`https://generativelanguage.googleapis.com/v1beta/${targetModel}:generateContent?key=${encodeURIComponent(API_KEY)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: "তুমি রিম্পা, শ্রীকান্তের ব্যক্তিগত বাংলা ভয়েস অ্যাসিস্ট্যান্ট। সংক্ষেপে ও স্পষ্ট বাংলায় উত্তর দাও: " + cmd }] }]
          })
        }, 12000);

        const data = await response.json();
        if (data.error) {
          document.getElementById("status").innerText = "সার্ভার ত্রুটি: " + data.error.message;
          return;
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "দুঃখিত, উত্তর খুঁজে পাইনি।";
        const cleanReply = reply.replace(/[*#_]/g, "");
        document.getElementById("replyText").innerText = cleanReply;
        document.getElementById("status").innerText = "কথা বলতে RIMPA-তে টাচ করুন";
        speak(cleanReply);
      } catch (err) {
        if (err.name === "AbortError") {
          document.getElementById("status").innerText = "সার্ভার সাড়া দিচ্ছে না, আবার টাচ করে বলুন";
        } else {
          document.getElementById("status").innerText = "ত্রুটি: " + err.message;
        }
      }
    }
  </script>
</body>
</html>
