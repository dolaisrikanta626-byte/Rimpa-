<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIMPA AI Assistant</title>
<style>
  body { margin: 0; background: #070b14; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; text-align: center; }
  .orb { width: 170px; height: 170px; border-radius: 50%; border: 3px solid #00f2fe; box-shadow: 0 0 35px rgba(0, 242, 254, 0.4); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; color: #00f2fe; letter-spacing: 3px; cursor: pointer; transition: 0.3s; user-select: none; }
  .orb.listening { border-color: #ff4b2b; color: #ff4b2b; box-shadow: 0 0 45px rgba(255, 75, 43, 0.7); transform: scale(1.06); }
  #status { margin-top: 25px; font-size: 16px; color: #94a3b8; padding: 0 20px; }
  #userText { margin-top: 12px; font-size: 15px; color: #cbd5e1; padding: 0 20px; }
  #replyText { margin-top: 15px; font-size: 17px; color: #38bdf8; max-width: 90%; line-height: 1.5; max-height: 30vh; overflow-y: auto; padding: 0 15px; }
  #keyBox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7,11,20,0.96); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
  input { padding: 12px; width: 80%; max-width: 320px; border-radius: 8px; border: 1px solid #00f2fe; background: #0f172a; color: #fff; margin-bottom: 12px; font-size: 14px; }
  button { padding: 10px 24px; border-radius: 8px; border: none; background: #00f2fe; color: #070b14; font-weight: bold; font-size: 15px; cursor: pointer; }
  .reset-btn { position: fixed; bottom: 15px; right: 15px; background: transparent; border: 1px solid #334155; color: #64748b; font-size: 12px; padding: 6px 10px; }
</style>
</head>
<body>

<div id="keyBox" style="display:none;">
  <h3 style="color:#00f2fe; margin-bottom:10px;">নতুন Gemini API Key দিন</h3>
  <input type="text" id="apiInput" placeholder="এখানে API Key পেস্ট করুন...">
  <button onclick="saveKey()">Save করুন</button>
</div>

<div class="orb" id="orb" onclick="startListening()">RIMPA</div>
<div id="status">কথা বলতে RIMPA-তে টাচ করুন</div>
<div id="userText"></div>
<div id="replyText"></div>
<button class="reset-btn" onclick="resetKey()">API Key বদলান</button>

<script>
  let API_KEY = localStorage.getItem("rimpa_gemini_key") || "";
  if (!API_KEY) document.getElementById("keyBox").style.display = "flex";

  function saveKey() {
    const val = document.getElementById("apiInput").value.trim();
    if (val) {
      localStorage.setItem("rimpa_gemini_key", val);
      API_KEY = val;
      document.getElementById("keyBox").style.display = "none";
      speak("নমস্কার শ্রীকান্ত, আমি রিম্পা। বলুন কীভাবে সাহায্য করতে পারি?");
    }
  }

  function resetKey() {
    localStorage.removeItem("rimpa_gemini_key");
    document.getElementById("keyBox").style.display = "flex";
  }

  function speak(text) {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "bn-IN";
    utter.rate = 1.0;
    window.speechSynthesis.speak(utter);
  }

  function startListening() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      document.getElementById("status").innerText = "আপনার ব্রাউজার ভয়েস সাপোর্ট করছে না";
      return;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = "bn-IN";
    recognition.interimResults = false;

    const orb = document.getElementById("orb");
    const status = document.getElementById("status");

    recognition.onstart = () => {
      orb.classList.add("listening");
      status.innerText = "শুনছি... বাংলায় বলুন";
    };

    recognition.onresult = async (event) => {
      const command = event.results[0][0].transcript;
      document.getElementById("userText").innerText = "আপনি: " + command;
      status.innerText = "রিম্পা ভাবছে...";
      await processCommand(command);
    };

    recognition.onerror = () => {
      orb.classList.remove("listening");
      status.innerText = "আবার টাচ করে বলুন";
    };

    recognition.onend = () => {
      orb.classList.remove("listening");
    };

    recognition.start();
  }

  async function processCommand(cmd) {
    if (cmd.includes("ইউটিউব") || cmd.toLowerCase().includes("youtube")) {
      speak("ইউটিউব খুলছি");
      window.open("https://www.youtube.com", "_blank");
      document.getElementById("status").innerText = "কথা বলতে RIMPA-তে টাচ করুন";
      return;
    }
    if (cmd.includes("হোয়াটসঅ্যাপ") || cmd.toLowerCase().includes("whatsapp")) {
      speak("হোয়াটসঅ্যাপ খুলছি");
      window.open("https://wa.me/", "_blank");
      document.getElementById("status").innerText = "কথা বলতে RIMPA-তে টাচ করুন";
      return;
    }

    try {
      const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": API_KEY
        },
        body: JSON.stringify({
          contents: [{ parts: [{ text: "তুমি রিম্পা, শ্রীকান্তের ব্যক্তিগত বাংলা ভয়েস অ্যাসিস্ট্যান্ট। সংক্ষেপে ও স্পষ্ট বাংলায় উত্তর দাও: " + cmd }] }],
          tools: [{ google_search: {} }]
        })
      });

      const data = await response.json();
      if (data.error) {
        document.getElementById("status").innerText = "ত্রুটি: " + data.error.message;
        return;
      }
      const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "দুঃখিত, উত্তর খুঁজে পাইনি।";
      const cleanReply = reply.replace(/[*#]/g, "");
      document.getElementById("replyText").innerText = cleanReply;
      document.getElementById("status").innerText = "কথা বলতে RIMPA-তে টাচ করুন";
      speak(cleanReply);
    } catch (err) {
      document.getElementById("status").innerText = "সংযোগে সমস্যা হচ্ছে, আবার চেষ্টা করুন";
    }
  }
</script>
</body>
</html>
