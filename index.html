<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIMPA - Super AI Assistant</title>
    <style>
        body {
            background-color: #050a14;
            color: #00f3ff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .core-container {
            position: relative;
            width: 210px;
            height: 210px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 3px solid transparent;
        }
        .ring1 {
            width: 200px;
            height: 200px;
            border-top: 3px solid #00f3ff;
            border-bottom: 3px solid #00f3ff;
            animation: spin 4s linear infinite;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }
        .ring2 {
            width: 165px;
            height: 165px;
            border-left: 3px solid #0088ff;
            border-right: 3px solid #0088ff;
            animation: spin-reverse 3s linear infinite;
        }
        .active .ring1 {
            animation: spin 1s linear infinite, pulse 0.5s infinite alternate;
            box-shadow: 0 0 35px #00f3ff;
        }
        .name {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 15px #00f3ff;
            z-index: 10;
        }
        .status {
            margin-top: 25px;
            font-size: 16px;
            color: #80e5ff;
        }
        .chat-box {
            margin-top: 20px;
            width: 100%;
            min-height: 90px;
        }
        #user-text { color: #aaaaaa; font-size: 14px; margin-bottom: 10px; }
        #ai-text { color: #ffffff; font-size: 17px; line-height: 1.5; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
    </style>
</head>
<body>

    <div class="core-container" id="core" onclick="startListening()">
        <div class="ring ring1"></div>
        <div class="ring ring2"></div>
        <div class="name">RIMPA</div>
    </div>

    <div class="status" id="status">কথা বলতে RIMPA-তে টাচ করুন</div>

    <div class="chat-box">
        <div id="user-text"></div>
        <div id="ai-text"></div>
    </div>

    <script>
        const API_KEY = "AQ.Ab8RN6JKFFTlX9cdavjcadN_tXx15EVAINHSvrqDzjnti5xA1g";

        const statusEl = document.getElementById('status');
        const userTextEl = document.getElementById('user-text');
        const aiTextEl = document.getElementById('ai-text');
        const coreEl = document.getElementById('core');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'bn-IN';
        recognition.interimResults = false;

        function startListening() {
            window.speechSynthesis.cancel();
            try {
                recognition.start();
                statusEl.innerText = "শুনছি... বাংলায় বলুন";
                coreEl.classList.add('active');
            } catch (e) {
                statusEl.innerText = "আবার টাচ করুন";
            }
        }

        recognition.onresult = async (event) => {
            const userSpeech = event.results[0][0].transcript;
            userTextEl.innerText = "আপনি: " + userSpeech;
            
            if (checkAppCommands(userSpeech)) return;

            statusEl.innerText = "রিম্পা ভাবছে ও খুঁজছে...";
            await askGemini(userSpeech);
        };

        recognition.onerror = () => {
            coreEl.classList.remove('active');
            statusEl.innerText = "শুনতে পাইনি, আবার টাচ করুন";
        };

        function checkAppCommands(text) {
            if (text.includes("ইউটিউব") || text.includes("YouTube")) {
                speakAndOpen("ঠিক আছে শ্রীকান্ত, ইউটিউব খুলছি।", "https://m.youtube.com");
                return true;
            } else if (text.includes("হোয়াটসঅ্যাপ") || text.includes("WhatsApp")) {
                speakAndOpen("হোয়াটসঅ্যাপ খুলছি।", "https://wa.me/");
                return true;
            } else if (text.includes("ফোন করো") || text.includes("কল করো") || text.includes("ডায়াল")) {
                speakAndOpen("ফোনের ডায়ালপ্যাড খুলছি।", "tel:");
                return true;
            }
            return false;
        }

        function speakAndOpen(reply, url) {
            aiTextEl.innerText = "রিম্পা: " + reply;
            speakBengali(reply);
            setTimeout(() => {
                window.location.href = url;
            }, 1500);
        }

        async function askGemini(prompt) {
            const systemInstruction = "তোমার নাম রিম্পা (Rimpa)। তুমি শ্রীকান্তর ব্যক্তিগত AI ভয়েস অ্যাসিস্ট্যান্ট। শ্রীকান্ত পশ্চিম মেদিনীপুরের দাসপুরে থাকেন। তুমি সবসময় খুব মিষ্টি, বন্ধুসুলভ, বুদ্ধিদীপ্ত এবং স্বাভাবিক বাংলায় কথা বলবে। আজকের খবর বা আবহাওয়া জানতে চাইলে গুগল সার্চ ব্যবহার করে সংক্ষিপ্ত ও সঠিক তথ্য দেবে। উত্তর ২-৩ লাইনের মধ্যে রাখবে এবং কোনো ইমোজি, লিংক বা স্টার চিহ্ন ব্যবহার করবে না।";
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: systemInstruction }] },
                        tools: [{ google_search: {} }],
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;
                aiTextEl.innerText = "রিম্পা: " + reply;
                speakBengali(reply);
            } catch (error) {
                coreEl.classList.remove('active');
                statusEl.innerText = "API Key বা ইন্টারনেট চেক করুন";
            }
        }

        function speakBengali(text) {
            statusEl.innerText = "রিম্পা কথা বলছে...";
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'bn-IN';
            utterance.rate = 1.0;
            utterance.pitch = 1.1;

            utterance.onend = () => {
                coreEl.classList.remove('active');
                statusEl.innerText = "আবার কথা বলতে টাচ করুন";
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
